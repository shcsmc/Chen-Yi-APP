# 开发分支上的检查：编译 + 单元测试，顺便打一个「备忘测试」包（包名 com.beiwang.memo.dev）。
# 测试包发到固定标签 dev 的「预发布」（每次覆盖），手机直接下载：
#   https://github.com/shcsmc/Chen-Yi-APP/releases/download/dev/beiwang-dev.apk
# 预发布不算 latest：正式版的 releases/latest/download/beiwang.apk 不受影响。
name: 分支测试包

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 版本号 = 提交数，需要完整历史

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # 测试包也用正式钥匙签：这样测试包之间能覆盖升级。包名不同，不会和正式版冲突
      - name: 还原签名文件
        env:
          KEYSTORE_B64: ${{ secrets.MEMO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/memo-release.jks"
            echo "MEMO_KEYSTORE_FILE=$RUNNER_TEMP/memo-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::没有签名 Secrets，测试包未签名（装不上，只做编译检查）"
          fi

      - name: 编译 + 单元测试
        working-directory: android
        env:
          MEMO_KEYSTORE_PASSWORD: ${{ secrets.MEMO_KEYSTORE_PASSWORD }}
          MEMO_KEY_ALIAS: memo
        run: |
          chmod +x gradlew
          ./gradlew assembleDev testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: beiwang-dev
          path: android/app/build/outputs/apk/dev/*.apk
          retention-days: 14

      - name: 发布到测试版（预发布，固定标签 dev）
        if: success() && env.MEMO_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/dev/*.apk beiwang-dev.apk
          NOTES="测试版（开发分支 ${GITHUB_REF_NAME}，提交 ${GITHUB_SHA::7}）。包名 com.beiwang.memo.dev，和正式版并排安装，不影响正式版数据。"
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev beiwang-dev.apk --clobber
            gh release edit dev --notes "$NOTES" --prerelease --latest=false
          else
            gh release create dev beiwang-dev.apk --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "备忘 测试版" --notes "$NOTES"
          fi
