# 开发分支上的检查：编译 + 单元测试，顺便打一个「辰Yi记测试」包（包名 com.beiwang.memo.dev）。
# 测试包发到固定标签 dev（每次覆盖），手机直接下载：
#   https://github.com/shcsmc/Chen-Yi-APP/releases/download/dev/beiwang-dev.apk
# 新版（原生）正式发布之前（main 里还是旧的网页版），测试版标成「最新」，仓库首页右边栏的 Releases 显示它；
# 这期间正式版的固定链接 releases/latest/download/beiwang.apk 用不了（两个版本的代码里都没有用它，
# 旧版 v1.0.3 从 releases/download/v1.0.3/beiwang.apk 下）。
# 打包（合并到 main）之后测试版自动改回「预发布」、不再占「最新」：手机正式版从那个固定链接更新。
name: 分支测试包

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 版本号 = 提交数，需要完整历史

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # 测试包也用正式钥匙签：这样测试包之间能覆盖升级。包名不同，不会和正式版冲突
      - name: 还原签名文件
        env:
          KEYSTORE_B64: ${{ secrets.MEMO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/memo-release.jks"
            echo "MEMO_KEYSTORE_FILE=$RUNNER_TEMP/memo-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::没有签名 Secrets，测试包未签名（装不上，只做编译检查）"
          fi

      - name: 编译 + 单元测试
        working-directory: android
        env:
          MEMO_KEYSTORE_PASSWORD: ${{ secrets.MEMO_KEYSTORE_PASSWORD }}
          MEMO_KEY_ALIAS: memo
        run: |
          chmod +x gradlew
          ./gradlew assembleDev testDebugUnitTest --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: beiwang-dev
          path: android/app/build/outputs/apk/dev/*.apk
          retention-days: 14

      - name: 发布测试版（固定标签 dev）
        if: success() && env.MEMO_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/dev/*.apk beiwang-dev.apk
          N=$(git rev-list --count HEAD)
          TITLE="辰Yi记 测试版 1.0.${N}"
          NOTES="测试版 1.0.${N}（开发分支 ${GITHUB_REF_NAME}，提交 ${GITHUB_SHA::7}）。包名 com.beiwang.memo.dev，和正式版并排安装，不影响正式版数据。"
          # main 里已经有新版代码（打包过了）→ 预发布、让出「最新」；还没打包 → 标成「最新」，右边栏显示测试版
          if git cat-file -e origin/main:android/app/src/main/java/com/beiwang/memo/data/Store.kt 2>/dev/null; then
            KIND="--prerelease --latest=false"
          else
            KIND="--prerelease=false --latest"
          fi
          if gh release view dev >/dev/null 2>&1; then
            gh release upload dev beiwang-dev.apk --clobber
            gh release edit dev --title "$TITLE" --notes "$NOTES" $KIND
          else
            gh release create dev beiwang-dev.apk --target "$GITHUB_SHA" $KIND --title "$TITLE" --notes "$NOTES"
          fi
