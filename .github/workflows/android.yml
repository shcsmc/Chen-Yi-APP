# 每次推送到 main：在 GitHub 上打正式签名的 APK，并发布成一个新的 Release。
# 手机上固定用这个地址下载最新版：
#   https://github.com/shcsmc/Chen-Yi-APP/releases/latest/download/beiwang.apk
name: 打包安卓 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # 版本号 = 提交数，需要完整历史

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: 还原签名文件
        env:
          KEYSTORE_B64: ${{ secrets.MEMO_KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.MEMO_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PW" ]; then
            echo "::error::缺少 Secrets：MEMO_KEYSTORE_BASE64 / MEMO_KEYSTORE_PASSWORD（仓库 Settings → Secrets and variables → Actions）"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/memo-release.jks"

      - name: 打包
        working-directory: android
        env:
          MEMO_KEYSTORE_FILE: ${{ runner.temp }}/memo-release.jks
          MEMO_KEYSTORE_PASSWORD: ${{ secrets.MEMO_KEYSTORE_PASSWORD }}
          MEMO_KEY_ALIAS: memo
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=$(git rev-list --count HEAD)
          TAG="v1.0.$N"
          APK=android/app/build/outputs/apk/release/app-release.apk
          cp "$APK" "beiwang-$TAG.apk"
          cp "$APK" beiwang.apk
          NOTES="$(git log -1 --pretty=%B)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "beiwang-$TAG.apk" beiwang.apk --clobber
          else
            gh release create "$TAG" "beiwang-$TAG.apk" beiwang.apk \
              --title "备忘 $TAG" --notes "$NOTES" --target "$GITHUB_SHA" --latest
          fi
